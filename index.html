<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0e1a24">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="贪吃蛇">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>贪吃蛇 · Snake</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:
    radial-gradient(circle at 20% 15%, rgba(46,204,113,.15), transparent 28%),
    radial-gradient(circle at 85% 80%, rgba(241,196,15,.10), transparent 30%),
    #0e1a24;
  display:flex; justify-content:center; align-items:center;
  min-height:100vh; overflow:hidden;
  font-family:'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif;
  -webkit-user-select:none; user-select:none;
}
#wrap{ position:relative; touch-action:none; width:min(420px,calc(100vw - 24px)); filter:drop-shadow(0 22px 35px rgba(0,0,0,.35)); }
canvas{ display:block; width:100%; height:auto; border-radius:18px; background:#142028; }
#hud{
  position:absolute; top:14px; left:0; right:0;
  display:grid; grid-template-columns:1fr 48px 1fr;
  align-items:center; padding:0 14px; pointer-events:none;
}
#hud > .hb:first-child{ justify-self:start; }
#hud #nw{ justify-self:end; }
.hb{
  background:rgba(20,30,35,.78); backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.1);
  border-radius:11px; padding:7px 11px;
  color:#fff; font-size:13px; font-weight:500; white-space:nowrap;
}
.hb b{ color:#2ecc71; }
#nw{ display:flex; align-items:center; gap:6px; }
#pauseBtn{
  width:42px; height:42px; justify-self:center;
  border-radius:10px; border:1px solid rgba(255,255,255,.12); cursor:pointer;
  background:rgba(20,30,35,.82); color:#fff; font-size:17px; line-height:1;
  backdrop-filter:blur(8px); transition:background .15s; pointer-events:all;
}
#pauseBtn:hover{ background:rgba(0,0,0,.65); }
#tools{ position:absolute; top:auto; bottom:12px; left:0; right:0; display:flex; justify-content:center; gap:6px; pointer-events:all; z-index:2; }
.toolBtn{ border:1px solid rgba(255,255,255,.12); border-radius:8px; padding:6px 9px; color:#fff; background:rgba(20,30,35,.78); cursor:pointer; font-size:12px; backdrop-filter:blur(8px); }
#dpad{ position:absolute; right:10px; bottom:60px; display:grid; grid-template-columns:36px 36px 36px; grid-template-rows:36px 36px 36px; gap:4px; pointer-events:all; z-index:3; opacity:.65; }
#dpad button{ border:1px solid rgba(255,255,255,.15); background:rgba(20,30,35,.72); color:#fff; border-radius:8px; font-size:16px; cursor:pointer; }
.ov{
  position:absolute; inset:0; display:none; flex-direction:column;
  justify-content:center; align-items:center;
  background:rgba(0,0,0,.82); backdrop-filter:blur(8px);
  border-radius:18px; z-index:10; padding:24px 20px;
}
.ov h1{ font-size:42px; color:#2ecc71; margin-bottom:8px; text-shadow:0 2px 20px rgba(46,204,113,.45); }
.ov .s{ font-size:22px; color:#e0e8e2; margin-bottom:6px; }
.ov .t{ font-size:15px; color:#8aa196; margin-bottom:20px; }
.ov button{
  padding:13px 48px; font-size:17px; font-weight:600; color:#0e1a24;
  border:none; border-radius:12px; cursor:pointer; pointer-events:all;
  background:linear-gradient(135deg,#a8e063,#2ecc71);
  box-shadow:0 6px 22px rgba(46,204,113,.35); transition:transform .15s;
  min-width:200px;
}
.ov button:hover{ transform:scale(1.05); }
#intro{ background:linear-gradient(160deg,rgba(10,30,24,.96),rgba(20,28,38,.96)); display:flex; }
#intro h1{ font-size:clamp(30px,9vw,42px); color:#2ecc71; margin-bottom:4px; letter-spacing:2px; }
#intro h1::after{ content:'简单·耐玩·会上瘾'; display:block; color:#8dcc76; font-size:12px; letter-spacing:3px; margin-top:6px; }
#intro p{ font-size:14px; color:#c4d0c8; line-height:1.8; text-align:center; margin:14px 0 18px; }
#intro .hint{ color:#7e9388; font-size:11px; margin-top:14px; }
#difficulty{ display:flex; gap:7px; margin:0 auto 20px; padding:5px; border-radius:13px; background:rgba(0,0,0,.22); }
.diffBtn{ border:1px solid transparent; border-radius:9px; padding:7px 10px; color:#bdcabe; background:transparent; cursor:pointer; font-size:13px; }
.diffBtn.selected{ color:#0e1a24; background:#a8e063; border-color:#d6ff9c; font-weight:bold; }
@media (max-width:480px){
  body{ min-height:100svh; }
  #hud{ padding:0 9px; }
  .hb{ padding:6px 8px; font-size:11px; }
  #tools{ bottom:8px; }
  .toolBtn{ padding:5px 6px; font-size:11px; }
  #dpad{ transform:scale(.85); transform-origin:bottom right; }
}
</style>
</head>
<body>
<div id="wrap">
<canvas id="cv" width="400" height="400"></canvas>
<div id="hud">
  <div class="hb">🏆 <b id="sc">0</b>　最高 <b id="best">0</b></div>
  <button id="pauseBtn" onclick="togglePause()">⏸</button>
  <div class="hb" id="nw">速度 ×<b id="lvl">1</b></div>
</div>
<div id="dpad" style="display:none">
  <div></div><button data-d="up">▲</button><div></div>
  <button data-d="left">◀</button><div></div><button data-d="right">▶</button>
  <div></div><button data-d="down">▼</button><div></div>
</div>
<div id="tools">
  <button class="toolBtn" id="soundBtn" onclick="toggleSound()">🔊 音效</button>
  <button class="toolBtn" id="musicBtn" onclick="toggleMusic()">🎵 音乐</button>
  <button class="toolBtn" onclick="clearBest()">清除最高分</button>
</div>
<div id="pause" class="ov">
  <h1>⏸ 已暂停</h1>
  <div class="t">按 P 或 Esc 继续</div>
  <button onclick="togglePause()">继续游戏</button>
</div>
<div id="over" class="ov">
  <h1>游戏结束</h1>
  <div class="s">最终得分：<b id="fs">0</b>　最高：<b id="fbest">0</b></div>
  <div class="t">再战一局？</div>
  <button onclick="restart()">重新开始</button>
</div>
<div id="win" class="ov">
  <h1>🏆 通关达成！</h1>
  <div class="s">你吃满了整张地图！</div>
  <div class="t">最终得分：<b id="ws">0</b>　最高：<b id="wbest">0</b></div>
  <button onclick="restart()">再来一局</button>
</div>
<div id="intro" class="ov" style="display:flex">
  <h1>🐍 贪吃蛇</h1>
  <p>
    方向键 / WASD 控制方向<br>
    手机滑动屏幕控制方向<br>
    吃到食物会变长，撞墙或撞自己就结束<br>
    食物越吃越多，速度也越来越快哦！
  </p>
  <div id="difficulty">
    <button class="diffBtn selected" data-diff="easy" onclick="selectDifficulty('easy')">🌱 简单</button>
    <button class="diffBtn" data-diff="normal" onclick="selectDifficulty('normal')">⭐ 普通</button>
    <button class="diffBtn" data-diff="hard" onclick="selectDifficulty('hard')">🔥 困难</button>
  </div>
  <button onclick="startGame()">开始游戏</button>
  <div class="hint">P / Esc 暂停　·　可在上方切换音效和音乐</div>
</div>
</div>
<script>
/* ═══════════════════════════════════════════════════
   贪吃蛇 — 纯JS实现，无外部依赖，离线可玩
   ═══════════════════════════════════════════════════ */

// ── 网格设置 ─────────────────────────────────────
const COLS = 20, ROWS = 20;
const CV_W = 400, CV_H = 400;
const CELL = CV_W / COLS;
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');

// ── 难度 ─────────────────────────────────────────
const DIFFICULTIES = {
  easy:   { label:'简单', base:8,    minStep:5,   accel:.05 },
  normal: { label:'普通', base:6.5,  minStep:3.5, accel:.08 },
  hard:   { label:'困难', base:5,    minStep:2.2, accel:.11 }
};
let difficulty = 'easy';

// ── 状态 ─────────────────────────────────────────
let snake, dir, nextDir, food, score, alive, paused, stepInterval, stepAcc, stepMs;
let bestScore = Number(localStorage.getItem('snakeBest') || 0);
let soundOn = localStorage.getItem('snakeSound') !== 'off';
let musicOn = localStorage.getItem('snakeMusic') !== 'off';
let audioCtx = null, musicTimer = null, musicStep = 0;

// ── 工具栏持久化显示 ─────────────────────────────
function updateBest() {
  if (score > bestScore) { bestScore = score; localStorage.setItem('snakeBest', String(bestScore)); }
  document.getElementById('best').textContent = bestScore;
  document.getElementById('fbest').textContent = bestScore;
  document.getElementById('wbest').textContent = bestScore;
}
function clearBest() {
  if (!confirm('确定要清除最高分吗？')) return;
  bestScore = 0; localStorage.removeItem('snakeBest'); updateBest();
}
function toggleSound() { soundOn = !soundOn; localStorage.setItem('snakeSound', soundOn ? 'on' : 'off'); updateAudioButtons(); }
function toggleMusic() {
  musicOn = !musicOn; localStorage.setItem('snakeMusic', musicOn ? 'on' : 'off');
  if (musicOn) { initAudio(); startMusic(); } else stopMusic(); updateAudioButtons();
}
function updateAudioButtons() {
  document.getElementById('soundBtn').textContent = soundOn ? '🔊 音效' : '🔇 音效';
  document.getElementById('musicBtn').textContent = musicOn ? '🎵 音乐' : '🔇 音乐';
}
function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}
function tone(freq, duration, type='sine', volume=.07, when=0, musical=false) {
  if ((!soundOn && !musical) || !audioCtx) return;
  const now = audioCtx.currentTime + when, o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, now);
  g.gain.setValueAtTime(.0001, now); g.gain.exponentialRampToValueAtTime(volume, now+.015);
  g.gain.exponentialRampToValueAtTime(.0001, now+duration);
  o.connect(g); g.connect(audioCtx.destination); o.start(now); o.stop(now+duration+.02);
}
function playEat()   { tone(660,.08,'sine',.06); tone(990,.12,'sine',.05,.05); }
function playDie()   { tone(220,.25,'sawtooth',.05); tone(120,.35,'sawtooth',.04,.15); }
function playStart() { [523,659,784].forEach((n,i)=>tone(n,.12,'sine',.05,i*.08)); }
function startMusic() {
  if (!musicOn || musicTimer) return;
  const notes = [196,247,294,247,220,262,330,262];
  musicTimer = setInterval(() => { if (!paused && alive) tone(notes[musicStep++ % notes.length], .18, 'triangle', .016, 0, true); }, 360);
}
function stopMusic() { if (musicTimer) { clearInterval(musicTimer); musicTimer = null; } }

updateBest(); updateAudioButtons();

// ── 难度选择 ─────────────────────────────────────
function selectDifficulty(name) {
  if (!DIFFICULTIES[name]) return;
  difficulty = name;
  document.querySelectorAll('.diffBtn').forEach(b => b.classList.toggle('selected', b.dataset.diff === name));
}

// ── 游戏初始化 ───────────────────────────────────
function resetGame() {
  const cx = (COLS/2)|0, cy = (ROWS/2)|0;
  snake = [{x:cx-1,y:cy},{x:cx,y:cy},{x:cx+1,y:cy}];
  dir = {x:1,y:0}; nextDir = {x:1,y:0};
  score = 0;
  stepAcc = 0;
  stepMs = DIFFICULTIES[difficulty].base * 50;  // ms per step
  alive = false; paused = false;
  document.getElementById('sc').textContent = '0';
  document.getElementById('pauseBtn').textContent = '⏸';
  spawnFood();
  draw();
}

function spawnFood() {
  let tries = 0;
  while (tries++ < 200) {
    const f = { x:(Math.random()*COLS)|0, y:(Math.random()*ROWS)|0 };
    if (!snake.some(s => s.x === f.x && s.y === f.y)) { food = f; return; }
  }
  food = null;  // 满了
}

function startGame() {
  document.getElementById('intro').style.display = 'none';
  resetGame();
  alive = true; paused = false;
  initAudio();
  if (musicOn) startMusic();
  playStart();
  lastT = performance.now();
  requestAnimationFrame(loop);
}

function restart() {
  document.getElementById('over').style.display = 'none';
  document.getElementById('win').style.display = 'none';
  document.getElementById('pause').style.display = 'none';
  resetGame();
  alive = true; paused = false;
  initAudio();
  if (musicOn) startMusic();
  lastT = performance.now();
  requestAnimationFrame(loop);
}

// ── 暂停 ─────────────────────────────────────────
function togglePause() {
  if (!alive) return;
  if (document.getElementById('win').style.display === 'flex') return;
  paused = !paused;
  document.getElementById('pauseBtn').textContent = paused ? '▶' : '⏸';
  document.getElementById('pause').style.display = paused ? 'flex' : 'none';
}

// ── 主循环 ───────────────────────────────────────
let lastT = 0;
function loop(ts) {
  if (!alive) return;
  const dt = Math.min((ts - lastT) / 1000, 0.1) || 1/60;
  lastT = ts;
  if (!paused) {
    stepAcc += dt * 1000;
    while (stepAcc >= stepMs) {
      stepAcc -= stepMs;
      step();
      if (!alive) break;
    }
  }
  draw();
  requestAnimationFrame(loop);
}

function step() {
  if (nextDir.x !== -dir.x || nextDir.y !== -dir.y) dir = nextDir;
  const head = snake[snake.length - 1];
  const nx = head.x + dir.x, ny = head.y + dir.y;
  if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS) return doOver();
  if (snake.some(s => s.x === nx && s.y === ny)) return doOver();
  snake.push({ x:nx, y:ny });
  if (food && nx === food.x && ny === food.y) {
    score++;
    updateBest();
    document.getElementById('sc').textContent = score;
    document.getElementById('lvl').textContent = (1 + (DIFFICULTIES[difficulty].base * 50 - stepMs) / 8).toFixed(1);
    playEat();
    spawnFood();
    // 加速
    const minStep = DIFFICULTIES[difficulty].minStep * 50;
    stepMs = Math.max(minStep, stepMs * (1 - DIFFICULTIES[difficulty].accel));
    if (!food) return doWin();
  } else {
    snake.shift();
  }
}

function doOver() {
  alive = false; stopMusic(); playDie();
  document.getElementById('fs').textContent = score;
  document.getElementById('fbest').textContent = bestScore;
  document.getElementById('over').style.display = 'flex';
}
function doWin() {
  alive = false; stopMusic(); playEat();
  document.getElementById('ws').textContent = score;
  document.getElementById('wbest').textContent = bestScore;
  document.getElementById('win').style.display = 'flex';
}

// ── 渲染 ─────────────────────────────────────────
function draw() {
  // 背景
  ctx.fillStyle = '#142028';
  ctx.fillRect(0, 0, CV_W, CV_H);

  // 边界危险区：最外圈格子泛红，提示玩家别靠近
  ctx.fillStyle = 'rgba(231, 76, 60, 0.10)';
  ctx.fillRect(0, 0, CV_W, CELL);
  ctx.fillRect(0, CV_H - CELL, CV_W, CELL);
  ctx.fillRect(0, 0, CELL, CV_H);
  ctx.fillRect(CV_W - CELL, 0, CELL, CV_H);
  // 四角加深
  const cg = ctx.createRadialGradient(0, 0, 0, 0, 0, CELL * 1.2);
  cg.addColorStop(0, 'rgba(231, 76, 60, 0.25)');
  cg.addColorStop(1, 'rgba(231, 76, 60, 0)');
  ctx.fillStyle = cg; ctx.fillRect(0, 0, CELL, CELL);
  const cg2 = ctx.createRadialGradient(CV_W, 0, 0, CV_W, 0, CELL * 1.2);
  cg2.addColorStop(0, 'rgba(231, 76, 60, 0.25)');
  cg2.addColorStop(1, 'rgba(231, 76, 60, 0)');
  ctx.fillStyle = cg2; ctx.fillRect(CV_W - CELL, 0, CELL, CELL);
  const cg3 = ctx.createRadialGradient(0, CV_H, 0, 0, CV_H, CELL * 1.2);
  cg3.addColorStop(0, 'rgba(231, 76, 60, 0.25)');
  cg3.addColorStop(1, 'rgba(231, 76, 60, 0)');
  ctx.fillStyle = cg3; ctx.fillRect(0, CV_H - CELL, CELL, CELL);
  const cg4 = ctx.createRadialGradient(CV_W, CV_H, 0, CV_W, CV_H, CELL * 1.2);
  cg4.addColorStop(0, 'rgba(231, 76, 60, 0.25)');
  cg4.addColorStop(1, 'rgba(231, 76, 60, 0)');
  ctx.fillStyle = cg4; ctx.fillRect(CV_W - CELL, CV_H - CELL, CELL, CELL);

  // 网格
  ctx.strokeStyle = 'rgba(255,255,255,.07)';
  ctx.lineWidth = 1;
  for (let i = 1; i < COLS; i++) {
    ctx.beginPath(); ctx.moveTo(i*CELL, 0); ctx.lineTo(i*CELL, CV_H); ctx.stroke();
  }
  for (let j = 1; j < ROWS; j++) {
    ctx.beginPath(); ctx.moveTo(0, j*CELL); ctx.lineTo(CV_W, j*CELL); ctx.stroke();
  }

  // 清晰边界线（外圈红框 + 内侧暖光）
  ctx.strokeStyle = 'rgba(231, 76, 60, 0.7)';
  ctx.lineWidth = 3;
  ctx.strokeRect(1.5, 1.5, CV_W - 3, CV_H - 3);
  ctx.strokeStyle = 'rgba(255, 200, 100, 0.18)';
  ctx.lineWidth = 1;
  ctx.strokeRect(5, 5, CV_W - 10, CV_H - 10);

  // 四角 L 形装饰
  ctx.strokeStyle = '#e74c3c';
  ctx.lineWidth = 4;
  ctx.lineCap = 'round';
  const cm = 12, cp = 3;
  // 左上
  ctx.beginPath(); ctx.moveTo(cp, cp + cm); ctx.lineTo(cp, cp); ctx.lineTo(cp + cm, cp); ctx.stroke();
  // 右上
  ctx.beginPath(); ctx.moveTo(CV_W - cp - cm, cp); ctx.lineTo(CV_W - cp, cp); ctx.lineTo(CV_W - cp, cp + cm); ctx.stroke();
  // 左下
  ctx.beginPath(); ctx.moveTo(cp, CV_H - cp - cm); ctx.lineTo(cp, CV_H - cp); ctx.lineTo(cp + cm, CV_H - cp); ctx.stroke();
  // 右下
  ctx.beginPath(); ctx.moveTo(CV_W - cp - cm, CV_H - cp); ctx.lineTo(CV_W - cp, CV_H - cp); ctx.lineTo(CV_W - cp, CV_H - cp - cm); ctx.stroke();
  ctx.lineCap = 'butt';

  // 食物
  if (food) drawFood(food.x, food.y);

  // 蛇
  for (let i = 0; i < snake.length; i++) {
    drawSegment(snake[i].x, snake[i].y, i, snake.length);
  }
}

function drawFood(x, y) {
  const cx = x*CELL + CELL/2, cy = y*CELL + CELL/2;
  const r = CELL * 0.38;
  // 阴影
  ctx.fillStyle = 'rgba(0,0,0,.3)';
  ctx.beginPath(); ctx.ellipse(cx, cy + r*0.7, r*0.9, r*0.25, 0, 0, Math.PI*2); ctx.fill();
  // 主体
  const g = ctx.createRadialGradient(cx - r*0.3, cy - r*0.35, r*0.1, cx, cy, r);
  g.addColorStop(0, '#ff8b8b'); g.addColorStop(0.6, '#e74c3c'); g.addColorStop(1, '#a93226');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.fill();
  // 高光
  ctx.fillStyle = 'rgba(255,255,255,.6)';
  ctx.beginPath(); ctx.ellipse(cx - r*0.28, cy - r*0.32, r*0.22, r*0.14, -0.3, 0, Math.PI*2); ctx.fill();
  // 叶子
  ctx.fillStyle = '#27ae60';
  ctx.beginPath(); ctx.ellipse(cx + r*0.1, cy - r*0.95, r*0.32, r*0.16, -0.5, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#52be80';
  ctx.beginPath(); ctx.ellipse(cx + r*0.2, cy - r*0.85, r*0.18, r*0.09, -0.3, 0, Math.PI*2); ctx.fill();
}

function drawSegment(x, y, i, len) {
  const isHead = i === len - 1;
  const isTail = i === 0;
  const cx = x*CELL + CELL/2, cy = y*CELL + CELL/2;
  const pad = 2, sz = CELL - pad*2;
  const r = sz * 0.32;
  // 渐变绿
  const t = len > 1 ? i / (len - 1) : 1;  // 0=tail, 1=head
  const hue = 130 + t * 30;  // 头更亮
  // 阴影
  ctx.fillStyle = 'rgba(0,0,0,.25)';
  rr(ctx, cx - sz/2, cy - sz/2 + 2, sz, sz, r); ctx.fill();
  // 身体
  const g = ctx.createLinearGradient(cx - sz/2, cy - sz/2, cx + sz/2, cy + sz/2);
  g.addColorStop(0, `hsl(${hue}, 55%, 55%)`);
  g.addColorStop(1, `hsl(${hue}, 65%, 35%)`);
  ctx.fillStyle = g;
  rr(ctx, cx - sz/2, cy - sz/2, sz, sz, r); ctx.fill();
  // 鳞片纹路（仅身体中段）
  if (!isHead && !isTail) {
    ctx.fillStyle = 'rgba(255,255,255,.08)';
    rr(ctx, cx - sz/2 + 2, cy - sz/2 + 2, sz - 4, (sz - 4)/2, r); ctx.fill();
  }
  if (isHead) {
    // 眼睛（朝向 dir）
    const ex = dir.x * 4, ey = dir.y * 4;
    const e1x = cx + (dir.y ? -sz*0.22 : sz*0.18) + ex*0.2;
    const e1y = cy + (dir.x ? -sz*0.22 : -sz*0.18) + ey*0.2;
    const e2x = cx + (dir.y ? sz*0.22 : sz*0.18) + ex*0.2;
    const e2y = cy + (dir.x ? sz*0.22 : -sz*0.18) + ey*0.2;
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(e1x, e1y, sz*0.13, 0, Math.PI*2); ctx.arc(e2x, e2y, sz*0.13, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#1a1a1a';
    ctx.beginPath();
    ctx.arc(e1x + ex*0.4, e1y + ey*0.4, sz*0.06, 0, Math.PI*2);
    ctx.arc(e2x + ex*0.4, e2y + ey*0.4, sz*0.06, 0, Math.PI*2);
    ctx.fill();
  }
}

function rr(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x+r, y); c.lineTo(x+w-r, y); c.quadraticCurveTo(x+w, y, x+w, y+r);
  c.lineTo(x+w, y+h-r); c.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
  c.lineTo(x+r, y+h); c.quadraticCurveTo(x, y+h, x, y+h-r);
  c.lineTo(x, y+r); c.quadraticCurveTo(x, y, x+r, y);
  c.closePath();
}

// ── 输入 ─────────────────────────────────────────
function setDir(dx, dy) {
  if (nextDir.x === -dx && nextDir.y === -dy) return;  // 不允许直接掉头
  nextDir = { x: dx, y: dy };
}

document.addEventListener('keydown', e => {
  if (e.code === 'ArrowUp' || e.code === 'KeyW') { e.preventDefault(); setDir(0,-1); }
  if (e.code === 'ArrowDown' || e.code === 'KeyS') { e.preventDefault(); setDir(0,1); }
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') { e.preventDefault(); setDir(-1,0); }
  if (e.code === 'ArrowRight' || e.code === 'KeyD') { e.preventDefault(); setDir(1,0); }
  if (e.code === 'KeyP' || e.code === 'Escape') togglePause();
});

// 触摸滑动
let touchStart = null;
cv.addEventListener('touchstart', e => { e.preventDefault(); const t = e.touches[0]; touchStart = {x:t.clientX, y:t.clientY}; }, {passive:false});
cv.addEventListener('touchmove', e => { e.preventDefault(); }, {passive:false});
cv.addEventListener('touchend', e => {
  e.preventDefault();
  if (!touchStart) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - touchStart.x, dy = t.clientY - touchStart.y;
  if (Math.abs(dx) < 14 && Math.abs(dy) < 14) return;  // 太短忽略
  if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? 1 : -1, 0);
  else setDir(0, dy > 0 ? 1 : -1);
  touchStart = null;
}, {passive:false});

// 方向键按钮（小屏）
document.querySelectorAll('#dpad button').forEach(b => {
  b.addEventListener('touchstart', e => { e.preventDefault(); const d = b.dataset.d;
    if (d==='up') setDir(0,-1); if (d==='down') setDir(0,1);
    if (d==='left') setDir(-1,0); if (d==='right') setDir(1,0);
  }, {passive:false});
  b.addEventListener('mousedown', e => { e.preventDefault(); const d = b.dataset.d;
    if (d==='up') setDir(0,-1); if (d==='down') setDir(0,1);
    if (d==='left') setDir(-1,0); if (d==='right') setDir(1,0);
  });
});

// 小屏自动显示方向键
function checkDpad() {
  const small = Math.min(window.innerWidth, window.innerHeight) < 600;
  document.getElementById('dpad').style.display = small ? 'grid' : 'none';
}
window.addEventListener('resize', checkDpad);
checkDpad();

// 防止页面滚动
document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, {passive:false});
</script>
